<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <title>Valet Manager (tray)</title>
  <!-- Transparent background — inherits tray bar bg -->
  <!-- V mark in currentColor so it adapts to light/dark tray themes -->
  <path
    fill-rule="evenodd"
    fill="currentColor"
    d="M2,3 L8.5,3 L11,8.8 L13.5,3 L20,3 L11,20 Z
       M4.8,3 L11,13.5 L17.2,3 Z"
  />
  <!-- Small dot at V tip to indicate "active" state -->
  <rect x="9.5" y="17" width="3" height="2" rx="1" fill="#5DCAA5"/>
</svg>
