[package]
name = "valet-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe          = { version = "0.34.2", features = ["default_fonts", "wgpu"] }
egui            = "0.34.2"
egui_extras     = { version = "0.34.2", features = ["all_loaders"] }
tokio           = { version = "1.44", features = ["full"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
toml            = "0.8"
toml_edit       = "0.22"
anyhow          = "1"
thiserror       = "2"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs            = "6"
which           = "7"
chrono          = { version = "0.4.41", features = ["serde"] }
notify          = "8"
tray-icon       = "0.21.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk             = "0.18"
notify-rust     = "4"
nix             = { version = "0.29", features = ["process", "signal", "fs"] }
sysinfo         = "0.33"
regex           = "1"
futures         = "0.3"
fuzzy-matcher   = "0.3.7"
reqwest         = { version = "0.12.15", features = ["json", "rustls-tls"], default-features = false }
rusqlite        = { version = "0.34", features = ["bundled"] }
handlebars      = "6.3"
rand            = { version = "0.9", features = ["std"] }
bcrypt          = "0.15.1"
rfd             = "0.15"
semver          = "1.0.25"
flate2          = "1.1"
tar             = "0.4.44"

[package.metadata.deb]
maintainer = "Al Amin Ahamed <n.mukto@codexpert.io>"
copyright = "2026, Al Amin Ahamed"
license-file = ["../LICENSE", "0"]
extended-description = "Native Linux GUI for managing Laravel Valet+ development environments."
section = "devel"
priority = "optional"
depends = "$auto, nginx, dnsmasq"
assets = [
    ["target/release/valet-manager", "usr/bin/", "755"],
    ["packaging/valet-manager.desktop", "usr/share/applications/", "644"],
    ["packaging/polkit/com.valetmanager.policy", "usr/share/polkit-1/actions/", "644"],
]
